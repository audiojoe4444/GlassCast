<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="GlassCast — a streaming podcast player for Meta Ray-Ban Display glasses.">
  <title>GlassCast</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="assertive"></div>
  <audio id="audio" preload="metadata"></audio>

  <!-- Reusable logo: a lens that's been cracked open by sound. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gc-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5CF0DC"/>
        <stop offset="1" stop-color="#A48BFF"/>
      </linearGradient>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>
